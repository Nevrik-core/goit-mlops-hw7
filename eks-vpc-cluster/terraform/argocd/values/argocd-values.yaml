server:
  service:
    type: ClusterIP
  extraArgs:
    - --loglevel
    - info
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false

configs:
  cm:
    timeout.reconciliation: 180s
  rbac:
    policy.default: role:admin
    policy.csv: |
      g, admin, role:admin
